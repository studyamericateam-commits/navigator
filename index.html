    <script type="importmap">
    {
      "imports": {
        "react": "https://cdn.jsdelivr.net/npm/react@18.3.1/+esm",
        "react/jsx-runtime": "https://cdn.jsdelivr.net/npm/react@18.3.1/jsx-runtime/+esm",
        "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm"
      }
    }
    </script>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <!--
      Запуск приложения. Раньше здесь подключался отдельный main.js — его убрали:
      это был лишний файл в цепочке кэша (index.html → main.js → app-vega.js).

      ВАЖНО про ?v= : Timeweb отдаёт файлы без заголовка Cache-Control, поэтому
      браузер кэширует их «на глазок» — иногда на много часов. 02.08.2026 из-за
      этого владелец выложила новую сборку, а получила старый PDF. Номер версии
      в адресе решает проблему: он меняется при каждой сборке (это отпечаток
      содержимого файла), браузер видит новый адрес и обязан скачать свежий код.
      Номер подставляет build.mjs — руками его править не нужно.
    -->
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";

      // Запасной адрес кода — тот, что проставила сборка в ЭТУ страницу.
      var ЗАПАС = "./app-vega.js?v=ecb39cc35d";
      var БАЗА = "./app-vega.js";   // полный адрес собираем сами, иначе сборка затрёт
      var запущено = false;

      function пуск(адрес) {
        if (запущено) return;
        запущено = true;
        // Версию, которая реально запустилась, показываем в кабинете куратора:
        // когда владелец говорит «ничего не поменялось», первый вопрос — какой код
        // у неё в браузере, и теперь ответ виден глазами и попадает в скриншот.
        try { window.НАВИГАТОР_ВЕРСИЯ = (/v=([A-Za-z0-9.-]+)/.exec(адрес) || [])[1] || ""; } catch (e) {}
        import(адрес).then(function (м) {
          createRoot(document.getElementById("root")).render(
            React.createElement(React.StrictMode, null, React.createElement(м.default))
          );
        }).catch(function () {
          document.getElementById("root").innerHTML =
            '<div style="font:16px/1.6 system-ui;padding:40px;text-align:center;color:#3a3630">' +
            'Навигатор не загрузился — похоже, пропала сеть.<br>Обнови страницу.</div>';
        });
      }

      // Какая версия кода сейчас настоящая — спрашиваем сервер, а не закэшированную
      // страницу. Timeweb отдаёт index.html без Cache-Control, и браузер держит его
      // часами: 09.11.2026 владелец выложила сборку, а в её вкладке осталась вчерашняя
      // страница со ссылкой на вчерашний код. Прежнее решение (перезагрузить вкладку,
      // если версия разошлась) спасало только один раз за сессию вкладки: флаг
      // «уже перезагружались» не знал, ДЛЯ КАКОЙ версии он поставлен, поэтому во
      // вкладке, открытой с вечера, проверка больше не срабатывала — и 10.11.2026
      // всё повторилось. Теперь номер версии берётся из сети ДО загрузки кода:
      // закэшированная страница больше не может запустить старый Навигатор, и
      // перезагружать вкладку не нужно вообще.
      var кран = new AbortController();
      var поздно = setTimeout(function () { кран.abort(); }, 2500);
      fetch("index.html", { cache: "no-store", signal: кран.signal })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (t) {
          clearTimeout(поздно);
          var м = /app-vega\.js\?v=([A-Za-z0-9.-]+)/.exec(t || "");
          пуск(м ? БАЗА + "?v=" + м[1] : ЗАПАС);
        })
        .catch(function () { clearTimeout(поздно); пуск(ЗАПАС); });
    </script>

  </body>
