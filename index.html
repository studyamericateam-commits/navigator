    <script type="importmap">
    {
      "imports": {
        "react": "https://cdn.jsdelivr.net/npm/react@18.3.1/+esm",
        "react/jsx-runtime": "https://cdn.jsdelivr.net/npm/react@18.3.1/jsx-runtime/+esm",
        "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm"
      }
    }
    </script>

  <body style="margin:0">
    <div id="root"></div>
    <!--
      Запуск приложения. Раньше здесь подключался отдельный main.js — его убрали:
      это был лишний файл в цепочке кэша (index.html → main.js → app-vega.js).

      ВАЖНО про ?v= : Timeweb отдаёт файлы без заголовка Cache-Control, поэтому
      браузер кэширует их «на глазок» — иногда на много часов. 02.08.2026 из-за
      этого владелец выложила новую сборку, а получила старый PDF. Номер версии
      в адресе решает проблему: он меняется при каждой сборке (это отпечаток
      содержимого файла), браузер видит новый адрес и обязан скачать свежий код.
      Номер подставляет build.mjs — руками его править не нужно.
    -->
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import App from "./app-vega.js?v=17f863b0c4";

      createRoot(document.getElementById("root")).render(
        React.createElement(React.StrictMode, null, React.createElement(App))
      );
    </script>

    <!--
      Самопроверка версии. 09.11.2026: Timeweb отдаёт и сам index.html без
      Cache-Control, поэтому браузер держал вчерашнюю страницу, а в ней — ссылку
      на вчерашний код. Владелец выложила новую сборку, зашла в кабинет ученицы,
      нажала «собрать стратегию заново» — и получила прежний результат, потому что
      считал его старый app-vega.js. Номер версии в адресе от этого не спасает:
      он лежит ВНУТРИ закэшированной страницы.

      Поэтому страница сама спрашивает сервер, какая версия сейчас настоящая, и,
      если разошлось, один раз перезагружается с новым адресом. Ученику ничего
      нажимать не нужно — он просто видит свежий Навигатор.

      Защита от зацикливания: перезагрузка не чаще одного раза за сессию вкладки.
      Любая ошибка (нет сети, сервер не ответил) молча игнорируется — проверка
      никогда не должна мешать человеку работать.
    -->
    <script>
      (function () {
        var МОЯ = "./app-vega.js?v=17f863b0c4";
        try {
          if (sessionStorage.getItem("навигатор-перезагружен")) return;
        } catch (e) { return; }
        var моя = /v=([\w.-]+)/.exec(МОЯ);
        if (!моя) return;
        setTimeout(function () {
          fetch("index.html", { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : null; })
            .then(function (t) {
              if (!t) return;
              var их = /\.\/app-vega\.js\?v=([\w.-]+)/.exec(t);
              if (!их || их[1] === моя[1]) return;
              try { sessionStorage.setItem("навигатор-перезагружен", "1"); } catch (e) { return; }
              location.replace(location.pathname + "?v=" + их[1] + location.hash);
            })
            .catch(function () {});
        }, 1500);
      })();
    </script>
  </body>
</html>
